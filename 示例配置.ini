; ============================================================
;  外置转内置 配置文件
;  ────────────────────────────────────────────────────────────
;  位置：必须与 外置转内置.exe 在同一目录
;  编码：UTF-8 或 GBK 均可（自动识别）
;
;  【格式】每行一个动作，英文逗号分隔 5 个字段：
;     类型,源路径,显示选项,目标文件夹,占用大小
;
;    ┌─────────┬──────────────────────────────────────────────┐
;    │ 类型    │ 软件 / 驱动 / bat / cmd / wcs / CMD          │
;    │ 源路径  │ 文件/文件夹/压缩包路径；                       │
;    │         │ CMD 类型时，此处填【命令行】本身               │
;    │ 显示选项│ 界面中显示的勾选项名称                         │
;    │ 目标目录│ 可选。绝对路径；留空用类型默认目录             │
;    │ 占用大小│ 可选。如 50MB / 2GB / 800KB / 数字(KB)。        │
;    │         │ 仅【软件/驱动】计入；勾选后状态栏汇总显示       │
;    └─────────┴──────────────────────────────────────────────┘
;
;  【同名合并】同一个"显示选项"可写多行，界面合并为一个勾选项，
;              勾选后按上下顺序依次执行；占用大小累加。
;  【注释】以 ; 或 # 开头的行。
;
;  【类型说明】
;    软件  — 拷贝/解压到目标目录（文件夹递归拷贝，zip/7z 自动解压）
;    驱动  — .inf 用 Win32 API 直接安装；
;             压缩包/目录 交给 DrvIndex.exe 安装
;    bat   — 拷到目标目录后执行
;    cmd   — 拷到目标目录后执行
;    wcs   — 拷到目标目录后由 PECMD.EXE LOAD 执行
;    CMD   — 直接执行命令行（不落文件），如 start notepad.exe
;
;  【默认目标目录】（第 4 字段留空时）
;    软件        -> X:\TOOL\
;    bat / 驱动  -> X:\TOOL\BAT\
;    cmd         -> X:\TOOL\CMD\
;    wcs         -> X:\TOOL\WCS\
;
;  ⚠ 下面路径仅为【示例】，请按实际情况修改为你的真实路径！
;  ⚠ 在正常 Windows 测试时，因无 X: 盘，请显式指定目标目录。
; ============================================================

; ── 软件：文件夹（递归拷贝到 X:\TOOL\<文件夹名>）──
软件,D:\Apps\Browser,浏览器,,50MB

; ── 软件：单个文件 + 指定目标目录 ──
软件,D:\Tools\MyApp.exe,我的程序,X:\Tools\MyApp,12MB

; ── 软件：压缩包（.zip / .7z 自动解压）──
软件,D:\Packages\Tools.zip,工具包,,200MB

; ── 驱动：.inf 直接安装（需管理员权限）──
驱动,D:\Drivers\NetCard.inf,网卡驱动,,8MB

; ── 驱动：压缩包/目录 交给 DrvIndex.exe ──
驱动,D:\Drivers\DriverPack.7z,驱动包,,1.5GB

; ── wcs：拷到目标后由 PECMD.EXE LOAD 执行 ──
wcs,D:\Scripts\NetSetup.wcs,网络设置,

; ── bat：拷到目标后执行 ──
bat,D:\Scripts\Clean.bat,系统清理,

; ── cmd：拷到目标后执行 ──
cmd,D:\Scripts\Info.cmd,系统信息,

; ── CMD（大写）：直接执行命令行，不落文件 ──
CMD,start notepad.exe,打开记事本,

; ── 合并示例：同一个"网络支持"包含驱动 + 脚本，勾选后依次执行 ──
驱动,D:\Drivers\NetCard.inf,网络支持,,100MB
wcs,D:\Scripts\NetSetup.wcs,网络支持,
